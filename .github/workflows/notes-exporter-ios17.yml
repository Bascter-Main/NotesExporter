name: Build NotesExporter iOS 17

on:
  push:
    branches: [main]
    paths-ignore:
      - 'build-output/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Install Theos
        run: |
          brew install make ldid
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$HOME/theos"
      - name: Build and verify universal dylib
        working-directory: NotesExporterTrollFools
        run: |
          export THEOS="$HOME/theos"
          make clean
          make FINALPACKAGE=1
          echo 'Candidate dylibs:'
          find . -type f -name 'NotesExporter.dylib' ! -path '*.dSYM/*' -print
          DYLIB=".theos/obj/NotesExporter.dylib"
          test -f "$DYLIB"
          FILEINFO=$(file "$DYLIB")
          echo "$FILEINFO"
          echo "$FILEINFO" | grep -q 'dynamically linked shared library'
          ARCHS=$(lipo -archs "$DYLIB")
          echo "Architectures: $ARCHS"
          echo "$ARCHS" | grep -qw arm64
          echo "$ARCHS" | grep -qw arm64e
          mkdir -p "$GITHUB_WORKSPACE/build-output"
          cp "$DYLIB" "$GITHUB_WORKSPACE/build-output/NotesExporter.dylib"
          shasum -a 256 "$GITHUB_WORKSPACE/build-output/NotesExporter.dylib" | tee "$GITHUB_WORKSPACE/build-output/NotesExporter.dylib.sha256"
      - name: Commit verified dylib to build-output
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f build-output/NotesExporter.dylib build-output/NotesExporter.dylib.sha256
          if git diff --cached --quiet; then
            echo 'No output changes to commit.'
          else
            git commit -m 'build: publish verified NotesExporter dylib [skip ci]'
            git push origin HEAD:main
          fi
